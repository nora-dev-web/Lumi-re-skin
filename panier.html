<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier | Lumière Skin</title>
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/webcss/all.min.css">
</head>
<body>

    <main class="cart-page">
        <div class="cart-card">
            <h1>Votre Panier</h1>
            
            <div id="cart-content">
                </div>

            <hr>

            <div class="cart-summary">
               
                <div class="summary-line total">
                    <span>Prix Total:</span>
                    <span id="total-price">0 DA</span>
                </div>
                
                <div class="cart-actions">
                    <button onclick="clearCart()" class="btn-secondary">Vider le panier</button>
                    <button onclick="window.location.href='caisse.html'" class="btn-primary">Passer à la caisse</button>
                </div>
                <a href="shop.html" class="back-shop">← Continuer mes achats</a>
            </div>
        </div>
    </main>

    <script src="panier.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récupération de compte | Lumière Skin</title>
    <link rel="stylesheet" href="authentification.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="auth-wrapper">
        <div class="auth-image-side">
            <div class="overlay">
                <div class="auth-logo">LUMIÈRE SKIN</div>
                <p>La sérénité commence par une peau saine.</p> 
            </div>
        </div>

        <div class="auth-form-side">
            <div class="auth-box">
                <h2>Récupération</h2>
                <p id="auth-subtitle">Saisissez votre email pour recevoir un lien de réinitialisation.</p>
                
                <form id="recovery-form">
                    <div class="input-group">
                        <label>Votre Email</label>
                        <input type="email" id="recovery-email" placeholder="ex: nora@gmail.com" required>
                    </div>
                    
                    <button type="submit" class="btn-auth">Envoyer le lien</button>
                </form>

                <div class="auth-footer-links">
                    <a href="authentification.html" class="back-link">← Retour au Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('recovery-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('recovery-email').value;
            alert("Un lien de récupération a été envoyé à : " + email);
            window.location.href = "authentification.html";
        });
    </script>
</body>
</html>
